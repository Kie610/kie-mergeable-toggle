# Adapted from vrchat-community/template-package .github/workflows/release.yml
# Difference: this repository's root IS the package, so packagePath is "." and
# the package name/version are read from package.json instead of a repo variable.
name: Build Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: .
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Read package.json
        id: pkg
        run: |
          echo "name=$(jq -r .name package.json)" >> $GITHUB_OUTPUT
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip" >> $GITHUB_ENV
          echo "unityPackage=${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.pkg.outputs.version }}" >> $GITHUB_ENV

      # Zip the package. .git / .github are excluded: they are repo plumbing, not package content.
      - name: Create Package Zip
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" . -x '.git/*' '.github/*' '.gitignore'

      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta -not -path './.git/*' >> metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList

      - name: Create Tag
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.version }}"

      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            package.json
          tag_name: ${{ env.version }}
          prerelease: ${{ contains(env.version, '-') }}
